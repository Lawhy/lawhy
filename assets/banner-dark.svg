<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" role="img" aria-label="let's make things work. — Yuan He, AI Researcher &amp; Engineer">
<style>
  text { dominant-baseline: central; }
  .tok { font: 600 44px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #E6EDF3; }
  .id { font: 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #484F58; text-anchor: middle; }
  .name { font: 650 26px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; letter-spacing: -0.01em; fill: #E6EDF3; text-anchor: middle; }
  .role { font: 12.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 0.28em; fill: #8D96A0; text-anchor: middle; }
  .chip { fill: #1C2128; }
  .pass { animation: pass 0.5s ease-out 0.97s both; }
  .ring { fill: none; stroke: #3FB950; stroke-width: 2; opacity: 0;
           transform-box: fill-box; transform-origin: center;
           animation: ring 0.9s ease-out 0.97s both; }
  .t { animation: in 0.45s cubic-bezier(.2,.7,.2,1) both; }
  .sub { animation: in 0.7s 0.97s cubic-bezier(.2,.7,.2,1) both; }
  .cursor { fill: #E6EDF3; animation: blink 1.1s steps(1) 0.97s infinite both; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pass { from { fill: #1C2128; } to { fill: #13391F; } }
  @keyframes ring { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.18, 1.35); } }
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .t, .sub, .cursor, .ring { animation: none; }
    .pass { animation: none; fill: #13391F; }
  }
</style>
